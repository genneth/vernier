# Flatpak manifest for local builds: the git source is this working tree's
# committed state. packaging/make-submission.sh rewrites that one source to the
# public URL, tag and commit for the copy that goes to Flathub.
app-id: io.github.genneth.Vernier
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: vernier

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # PDFs are chosen through the file-chooser portal: no filesystem access.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  env:
    CARGO_HOME: /run/build/vernier/cargo
    CARGO_NET_OFFLINE: 'true'
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib

modules:
  - name: vernier
    buildsystem: simple
    build-commands:
      - cargo --offline build --release -p vernier
      - install -Dm755 target/release/vernier -t /app/bin
      - install -Dm644 packaging/io.github.genneth.Vernier.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.genneth.Vernier.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 packaging/io.github.genneth.Vernier.metainfo.xml -t /app/share/metainfo
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.genneth.Vernier
    sources:
      - type: git
        path: ..
        branch: main
      - cargo-sources.json
