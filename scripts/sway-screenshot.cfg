# Headless sway layout for Flathub screenshots (scripts/screenshots.sh):
# a 1000×700 output (the Flathub quality-guideline maximum) with the app as a
# floating window, so GTK draws its client-side decorations (rounded corners
# and shadow) over a flat backdrop that the driver then makes transparent.
output HEADLESS-1 resolution 1000x700 bg #7f7f7f solid_color
default_border none
default_floating_border none
bar mode invisible
for_window [app_id="io.github.genneth.Vernier"] floating enable, resize set 940 620, move position center
